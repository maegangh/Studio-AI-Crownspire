<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 150" width="100%" height="100%">
  <defs>
    <!-- White Marble Gradient -->
    <linearGradient id="marbleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="40%" stop-color="#F5F7FA" />
      <stop offset="80%" stop-color="#E4E8F0" />
      <stop offset="100%" stop-color="#D2D8E4" />
    </linearGradient>

    <!-- Metallic Gold Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF3D1" />
      <stop offset="25%" stop-color="#EBC463" />
      <stop offset="50%" stop-color="#C59B27" />
      <stop offset="75%" stop-color="#EBC463" />
      <stop offset="100%" stop-color="#916F13" />
    </linearGradient>

    <!-- Sapphire Crystal Gradient -->
    <radialGradient id="sapphireGrad" cx="50%" cy="50%" r="50%" fx="30%" fy="30%">
      <stop offset="0%" stop-color="#A5F3FC" />
      <stop offset="30%" stop-color="#00D2FF" />
      <stop offset="70%" stop-color="#0052FF" />
      <stop offset="100%" stop-color="#051C61" />
    </radialGradient>

    <!-- Drop Shadow Filter -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000000" flood-opacity="0.4" />
    </filter>

    <!-- Blue Magic Glow Filter -->
    <filter id="blueGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- 1. Background Marble Panel with Elegant Bottom Arch -->
  <path d="M 0 0 
           L 720 0 
           L 720 100 
           Q 360 145 0 100 
           Z" 
        fill="url(#marbleGrad)" 
        filter="url(#shadow)" />

  <!-- Marble Texture Accent Veins -->
  <path d="M 50 10 Q 150 40 250 15 T 450 60 Q 550 20 680 80" 
        fill="none" 
        stroke="#A0AEC0" 
        stroke-width="1.5" 
        stroke-linecap="round" 
        opacity="0.12" />
  <path d="M 20 80 Q 180 50 300 90 T 550 40 Q 620 90 700 30" 
        fill="none" 
        stroke="#A0AEC0" 
        stroke-width="1" 
        stroke-linecap="round" 
        opacity="0.08" />

  <!-- 2. Ornate Gold Filigree Borders (Top & Bottom) -->
  <!-- Top Gold Border Line -->
  <rect x="0" y="0" width="720" height="6" fill="url(#goldGrad)" />
  <rect x="0" y="9" width="720" height="2" fill="url(#goldGrad)" opacity="0.5" />

  <!-- Bottom Arch Gold Border -->
  <path d="M 0 100 
           Q 360 145 720 100 
           L 720 105 
           Q 360 151 0 105 
           Z" 
        fill="url(#goldGrad)" />
  <!-- Secondary thin Gold Arch line -->
  <path d="M 10 93 
           Q 360 137 710 93" 
        fill="none" 
        stroke="url(#goldGrad)" 
        stroke-width="2" 
        opacity="0.6" />

  <!-- Left/Right Corner Ornaments -->
  <!-- Left Corner -->
  <path d="M 6 6 L 30 6 Q 18 18 6 30 Z" fill="url(#goldGrad)" opacity="0.9" />
  <circle cx="18" cy="18" r="3" fill="#FFF" />
  <!-- Right Corner -->
  <path d="M 714 6 L 690 6 Q 702 18 714 30 Z" fill="url(#goldGrad)" opacity="0.9" />
  <circle cx="702" cy="18" r="3" fill="#FFF" />

  <!-- 3. Gold Filigree Crest (Symmetrical Center Accent) -->
  <g transform="translate(360, 110) scale(0.9)">
    <!-- Wings of the crest -->
    <path d="M -80 -15 Q -40 -35 0 -15 Q 40 -35 80 -15 Q 45 15 0 25 Q -45 15 -80 -15 Z" fill="url(#goldGrad)" />
    <!-- Inner cutout detail -->
    <path d="M -60 -12 Q -30 -25 0 -10 Q 30 -25 60 -12 Q 35 10 0 16 Q -35 10 -60 -12 Z" fill="#E4E8F0" />
    <!-- Center Jewel Frame -->
    <circle cx="0" cy="5" r="22" fill="url(#goldGrad)" />
    <circle cx="0" cy="5" r="18" fill="#1A202C" />
  </g>

  <!-- 4. Glowing Sapphire Centerpiece (The Magical Nucleus) -->
  <g transform="translate(360, 115)">
    <!-- Soft blue glow backing -->
    <circle cx="0" cy="0" r="25" fill="#00D2FF" opacity="0.3" filter="url(#blueGlow)" />
    <!-- Sapphire Crystal (Diamond Cut Hexagon) -->
    <polygon points="0,-16 14,-7 14,9 0,18 -14,9 -14,-7" fill="url(#sapphireGrad)" />
    <!-- Light reflection facets -->
    <polygon points="0,-16 0,0 -14,-7" fill="#FFF" opacity="0.25" />
    <polygon points="0,-16 14,-7 0,0" fill="#FFF" opacity="0.15" />
    <polygon points="0,0 14,-7 14,9" fill="#000" opacity="0.15" />
    <polygon points="0,0 0,18 -14,9" fill="#000" opacity="0.25" />
    <!-- Highlight Sparkle -->
    <circle cx="-4" cy="-5" r="3" fill="#FFF" opacity="0.7" />
  </g>

</svg>
