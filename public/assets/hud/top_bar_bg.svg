<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 150" width="100%" height="100%">
  <defs>
    <!-- Dark Purple Translucent Gradient -->
    <linearGradient id="panelGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0b0d19" />
      <stop offset="100%" stop-color="#06070e" />
    </linearGradient>

    <!-- Glowing Purple Border Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2d2150" />
      <stop offset="50%" stop-color="#4c3983" />
      <stop offset="100%" stop-color="#1e1635" />
    </linearGradient>
  </defs>

  <!-- Top container panel with beveled/rounded corners at bottom left/right -->
  <path d="M 0 0 
           L 720 0 
           L 720 130
           L 700 145
           L 20 145
           L 0 130
           Z" 
        fill="url(#panelGrad)" 
        stroke="url(#borderGrad)" 
        stroke-width="2" />

  <!-- Double border inner line -->
  <path d="M 4 4 
           L 716 4 
           L 716 128
           L 698 141
           L 22 141
           L 4 128
           Z" 
        fill="none" 
        stroke="#4a2e80" 
        stroke-width="1" 
        opacity="0.6" />

  <!-- Accent corner diamonds -->
  <g transform="translate(14, 131)" fill="#7c5dfa">
    <polygon points="0,-3 3,0 0,3 -3,0" />
  </g>
  <g transform="translate(706, 131)" fill="#7c5dfa">
    <polygon points="0,-3 3,0 0,3 -3,0" />
  </g>
</svg>
