<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 120" width="100%" height="100%">
  <defs>
    <!-- White Marble Gradient -->
    <linearGradient id="marbleGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#D2D8E4" />
      <stop offset="20%" stop-color="#E4E8F0" />
      <stop offset="70%" stop-color="#F5F7FA" />
      <stop offset="100%" stop-color="#FFFFFF" />
    </linearGradient>

    <!-- Metallic Gold Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF3D1" />
      <stop offset="25%" stop-color="#EBC463" />
      <stop offset="50%" stop-color="#C59B27" />
      <stop offset="75%" stop-color="#EBC463" />
      <stop offset="100%" stop-color="#916F13" />
    </linearGradient>

    <!-- Sapphire Crystal Gradient -->
    <radialGradient id="sapphireGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#A5F3FC" />
      <stop offset="40%" stop-color="#00D2FF" />
      <stop offset="80%" stop-color="#0052FF" />
      <stop offset="100%" stop-color="#051C61" />
    </radialGradient>

    <!-- Socket Dark Recessed Gradient -->
    <radialGradient id="socketGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#07090E" />
      <stop offset="60%" stop-color="#121622" />
      <stop offset="100%" stop-color="#1B2132" />
    </radialGradient>

    <!-- Drop Shadow Filter (cast upwards) -->
    <filter id="topShadow" x="-10%" y="-20%" width="120%" height="140%">
      <feDropShadow dx="0" dy="-6" stdDeviation="6" flood-color="#000000" flood-opacity="0.5" />
    </filter>

    <!-- Blue Magic Glow Filter -->
    <filter id="blueGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- 1. Main Background Panel with Elegant Top Arch -->
  <path d="M 0 120 
           L 720 120 
           L 720 35 
           Q 360 5 0 35 
           Z" 
        fill="url(#marbleGrad)" 
        filter="url(#topShadow)" />

  <!-- Marble Texture Accent Veins -->
  <path d="M 30 100 Q 150 70 280 110 T 500 80 Q 620 110 700 70" 
        fill="none" 
        stroke="#A0AEC0" 
        stroke-width="1.2" 
        stroke-linecap="round" 
        opacity="0.1" />

  <!-- 2. Gold Filigree Border on Top Arch -->
  <path d="M 0 35 
           Q 360 5 720 35 
           L 720 40 
           Q 360 10 0 40 
           Z" 
        fill="url(#goldGrad)" />
  <path d="M 10 47 
           Q 360 18 710 47" 
        fill="none" 
        stroke="url(#goldGrad)" 
        stroke-width="1.5" 
        opacity="0.5" />

  <!-- 3. SIX Circular Sockets for Buttons (Centered and perfectly spaced) -->
  <!-- Sockets at x-positions: 60, 180, 300, 420, 540, 660 -->
  <!-- Let's map them perfectly. Since total width is 720, spacing is:
       Interval = 720 / 6 = 120. Centers:
       1: 60
       2: 180
       3: 300
       4: 420
       5: 540
       6: 660
  -->
  
  <!-- Socket 1: Heroes -->
  <g transform="translate(60, 65)">
    <!-- Deep recess -->
    <circle cx="0" cy="0" r="42" fill="url(#socketGrad)" stroke="url(#goldGrad)" stroke-width="3" />
    <!-- Inner shadow ring -->
    <circle cx="0" cy="0" r="39" fill="none" stroke="#000" stroke-width="2" opacity="0.4" />
  </g>

  <!-- Socket 2: Wayfinder -->
  <g transform="translate(180, 55)">
    <circle cx="0" cy="0" r="42" fill="url(#socketGrad)" stroke="url(#goldGrad)" stroke-width="3" />
    <circle cx="0" cy="0" r="39" fill="none" stroke="#000" stroke-width="2" opacity="0.4" />
    <!-- Sapphire Indicator on top of socket border -->
    <circle cx="0" cy="-42" r="5" fill="url(#goldGrad)" />
    <circle cx="0" cy="-42" r="3" fill="url(#sapphireGrad)" />
  </g>

  <!-- Socket 3: Bag -->
  <g transform="translate(300, 50)">
    <circle cx="0" cy="0" r="42" fill="url(#socketGrad)" stroke="url(#goldGrad)" stroke-width="3" />
    <circle cx="0" cy="0" r="39" fill="none" stroke="#000" stroke-width="2" opacity="0.4" />
  </g>

  <!-- Socket 4: Quest -->
  <g transform="translate(420, 50)">
    <circle cx="0" cy="0" r="42" fill="url(#socketGrad)" stroke="url(#goldGrad)" stroke-width="3" />
    <circle cx="0" cy="0" r="39" fill="none" stroke="#000" stroke-width="2" opacity="0.4" />
  </g>

  <!-- Socket 5: Alliance -->
  <g transform="translate(540, 55)">
    <circle cx="0" cy="0" r="42" fill="url(#socketGrad)" stroke="url(#goldGrad)" stroke-width="3" />
    <circle cx="0" cy="0" r="39" fill="none" stroke="#000" stroke-width="2" opacity="0.4" />
    <!-- Sapphire Indicator on top of socket border -->
    <circle cx="0" cy="-42" r="5" fill="url(#goldGrad)" />
    <circle cx="0" cy="-42" r="3" fill="url(#sapphireGrad)" />
  </g>

  <!-- Socket 6: World / City -->
  <g transform="translate(660, 65)">
    <circle cx="0" cy="0" r="42" fill="url(#socketGrad)" stroke="url(#goldGrad)" stroke-width="3" />
    <circle cx="0" cy="0" r="39" fill="none" stroke="#000" stroke-width="2" opacity="0.4" />
  </g>

  <!-- 4. Corner Filigree / Side Braces -->
  <!-- Left Wing Brace -->
  <path d="M 0 50 Q 20 50 25 70 T 0 110 Z" fill="url(#goldGrad)" opacity="0.8" />
  <circle cx="10" cy="75" r="3" fill="url(#sapphireGrad)" />
  
  <!-- Right Wing Brace -->
  <path d="M 720 50 Q 700 50 695 70 T 720 110 Z" fill="url(#goldGrad)" opacity="0.8" />
  <circle cx="710" cy="75" r="3" fill="url(#sapphireGrad)" />

</svg>
