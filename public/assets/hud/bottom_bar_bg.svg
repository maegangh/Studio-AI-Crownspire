<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 120" width="100%" height="100%">
  <defs>
    <!-- Dark Purple Translucent Gradient -->
    <linearGradient id="panelGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0b0d19" />
      <stop offset="100%" stop-color="#06070e" />
    </linearGradient>

    <!-- Glowing Purple Border Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2d2150" />
      <stop offset="50%" stop-color="#4c3983" />
      <stop offset="100%" stop-color="#1e1635" />
    </linearGradient>

    <!-- Crown Crest Gradient -->
    <linearGradient id="crownGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4c368c" />
      <stop offset="50%" stop-color="#221545" />
      <stop offset="100%" stop-color="#140a2c" />
    </linearGradient>

    <!-- Crown Accent Glow -->
    <filter id="crownGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#8b5cf6" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Main Beveled Container with a flat bottom -->
  <path d="M 0 120 
           L 720 120 
           L 720 25
           L 700 15
           L 385 15
           L 380 5
           L 340 5
           L 335 15
           L 20 15
           L 0 25
           Z" 
        fill="url(#panelGrad)" 
        stroke="url(#borderGrad)" 
        stroke-width="2" />

  <!-- Inner border inset for double line style -->
  <path d="M 4 116 
           L 716 116 
           L 716 27
           L 698 18
           L 384 18
           L 377 9
           L 343 9
           L 336 18
           L 22 18
           L 4 27
           Z" 
        fill="none" 
        stroke="#4a2e80" 
        stroke-width="1" 
        opacity="0.6" />

  <!-- Corner decorations at the top-left and top-right bevel joints -->
  <g transform="translate(18, 18)" fill="#7c5dfa">
    <circle cx="0" cy="0" r="2" />
  </g>
  <g transform="translate(702, 18)" fill="#7c5dfa">
    <circle cx="0" cy="0" r="2" />
  </g>

  <!-- Crown / Crest on top center -->
  <g filter="url(#crownGlow)">
    <!-- Base plate -->
    <path d="M 345 15 L 375 15 L 370 8 L 350 8 Z" fill="#1b123a" stroke="#4c368c" stroke-width="1.5" />
    <!-- Symmetrical fantasy crown crest -->
    <path d="M 360 -8 
             L 367 0 
             L 379 -4 
             L 375 13 
             L 360 17 
             L 345 13 
             L 341 -4 
             L 353 0 
             Z" 
          fill="url(#crownGrad)" 
          stroke="#5c3db5" 
          stroke-width="1.5" />
    <!-- Center glowing diamond on the crown -->
    <polygon points="360,2 364,6 360,10 356,6" fill="#a78bfa" />
    <polygon points="360,-1 362,2 360,5 358,2" fill="#fff" opacity="0.8" />
  </g>
</svg>
