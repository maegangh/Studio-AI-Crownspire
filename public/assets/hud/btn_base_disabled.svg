<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <!-- Dull Grey Marble Gradient -->
    <linearGradient id="marbleGradDisabled" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E2E8F0" />
      <stop offset="50%" stop-color="#CBD5E1" />
      <stop offset="100%" stop-color="#94A3B8" />
    </linearGradient>

    <!-- Steel Silver/Grey Frame Gradient -->
    <linearGradient id="silverGradDisabled" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#94A3B8" />
      <stop offset="30%" stop-color="#64748B" />
      <stop offset="50%" stop-color="#475569" />
      <stop offset="80%" stop-color="#64748B" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>

    <!-- Dull Dark Sapphire Crystal -->
    <radialGradient id="sapphireGradDisabled" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#475569" />
      <stop offset="60%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#0F172A" />
    </radialGradient>

    <!-- Flat Shadow -->
    <filter id="disabledShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000" flood-opacity="0.15" />
    </filter>
  </defs>

  <g filter="url(#disabledShadow)" opacity="0.65">
    <!-- 1. Steel-Silver Frame Border -->
    <circle cx="50" cy="50" r="46" fill="url(#silverGradDisabled)" />
    <circle cx="50" cy="50" r="42" fill="#1E293B" />

    <!-- 2. Grey Marble Core Button Body -->
    <circle cx="50" cy="50" r="39" fill="url(#marbleGradDisabled)" />

    <!-- 3. Inner Silver Bezel -->
    <circle cx="50" cy="50" r="14" fill="url(#silverGradDisabled)" />
    <circle cx="50" cy="50" r="11" fill="#1E293B" />

    <!-- 4. Dull Sapphire Crystal Center Accent -->
    <circle cx="50" cy="50" r="9" fill="url(#sapphireGradDisabled)" />
  </g>
</svg>
